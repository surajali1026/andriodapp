<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="color-scheme" content="dark">
<style>html,body,#chart{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#0b0e11}#chart{position:absolute;inset:0}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa4b2;background:#0b0e11;font:13px Arial;z-index:2}</style>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script></head>
<body><div id="loading">Connecting to Binance Futures market data…</div><div id="chart"></div>
<script>
(function(){
const host=document.getElementById('chart'),loading=document.getElementById('loading');let chart=null,series=null,alertLines=[],activeSymbol='',activeInterval='',lastCount=0,forceReset=true;
function init(){if(!window.LightweightCharts){loading.textContent='Chart library failed to load. Check internet connection.';return;}
chart=LightweightCharts.createChart(host,{width:host.clientWidth,height:host.clientHeight,layout:{background:{type:'solid',color:'#0b0e11'},textColor:'#d1d4dc'},grid:{vertLines:{color:'#1e222d'},horzLines:{color:'#1e222d'}},rightPriceScale:{borderColor:'#363c4e',autoScale:true},timeScale:{borderColor:'#363c4e',timeVisible:true,secondsVisible:false},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:true},handleScale:{axisPressedMouseMove:true,mouseWheel:true,pinch:true}});
series=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderUpColor:'#26a69a',borderDownColor:'#ef5350',wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
new ResizeObserver(()=>chart.applyOptions({width:host.clientWidth,height:host.clientHeight})).observe(host);loading.style.display='none';window.chartReady=true;}
window.setCandles=function(rows,symbol){if(!series)return;const clean=(rows||[]).map(x=>({time:Math.floor(Number(x.time)/1000),open:Number(x.open),high:Number(x.high),low:Number(x.low),close:Number(x.close)})).filter(x=>Number.isFinite(x.time)&&x.time>0&&x.open>0&&x.high>=Math.max(x.open,x.close,x.low)&&x.low<=Math.min(x.open,x.close,x.high)).sort((a,b)=>a.time-b.time).filter((x,i,a)=>i===0||x.time!==a[i-1].time);if(!clean.length)return;if(forceReset||lastCount===0||clean.length<lastCount){series.setData(clean);chart.timeScale().fitContent();forceReset=false;}else{series.update(clean[clean.length-1]);}if(symbol)activeSymbol=symbol;lastCount=clean.length;};
window.setSymbolInfo=function(symbol,interval){symbol=String(symbol||'');interval=String(interval||'');if(symbol!==activeSymbol||interval!==activeInterval){activeSymbol=symbol;activeInterval=interval;lastCount=0;forceReset=true;}};
window.setAlerts=function(items){if(!series)return;alertLines.forEach(line=>series.removePriceLine(line));alertLines=[];(items||[]).forEach(a=>{const p=Number(a.price);if(Number.isFinite(p)&&p>0)alertLines.push(series.createPriceLine({price:p,color:'#f5a623',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'Alert'}));});};
window.addEventListener('load',init);
})();
</script></body></html>
