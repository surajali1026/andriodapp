<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<style>
html,body,#tv_chart_container{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#0b0e11}
body{font-family:Arial,sans-serif}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0e11;color:#9aa4b2;font-size:13px;z-index:1}
#tv_chart_container{position:absolute;inset:0}
</style>
<script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
<div id="loading">Loading TradingView chart…</div>
<div id="tv_chart_container"></div>
<script>
(function(){
  const loading=document.getElementById('loading');
  let widget=null;
  let currentSymbol='BITSTAMP:BTCUSD';
  let currentInterval='1';
  function showError(message){
    loading.textContent=message;
    loading.style.display='flex';
  }
  function startChart(){
    if(!window.TradingView || !window.TradingView.widget){
      showError('TradingView could not load. Please check your internet connection.');
      return;
    }
    try{
      widget=new TradingView.widget({
        autosize:true,
        symbol:currentSymbol,
        interval:currentInterval,
        timezone:'Etc/UTC',
        theme:'dark',
        style:'1',
        locale:'en',
        toolbar_bg:'#0b0e11',
        enable_publishing:false,
        allow_symbol_change:true,
        save_image:false,
        hide_side_toolbar:false,
        details:true,
        hotlist:false,
        calendar:false,
        withdateranges:true,
        container_id:'tv_chart_container',
        support_host:'https://www.tradingview.com'
      });
      loading.style.display='none';
      window.tradingViewReady=true;
    }catch(e){
      showError('Unable to start TradingView chart.');
    }
  }
  window.addEventListener('load',startChart);
  window.setSymbolInfo=function(symbol,interval){
    if(symbol) currentSymbol=String(symbol).replace(/[^A-Za-z0-9:_-]/g,'');
    if(interval) currentInterval=String(interval).replace(/[^0-9A-Za-z]/g,'');
  };
  // TradingView's embedded chart owns its symbol search, timeframe selector,
  // candles, price scale, crosshair and market-data connection.
})();
</script>
</body>
</html>
