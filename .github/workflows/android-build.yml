name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK and Emulator Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper JAR exists
        run: |
          mkdir -p android/gradle/wrapper
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          chmod +x android/gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: ''

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platform-tools" "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Run Android emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -eu
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.tradingview.binancefutures || true
            adb shell monkey -p com.tradingview.binancefutures -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.tradingview.binancefutures
            adb shell dumpsys activity activities | grep -F com.tradingview.binancefutures
            adb logcat -d -v brief > android-emulator-logcat.txt
            if grep -A 20 'FATAL EXCEPTION' android-emulator-logcat.txt | grep -F 'com.tradingview.binancefutures'; then
              echo 'App crashed during emulator launch'
              exit 1
            fi
            adb shell screencap -p /sdcard/chart-smoke.png
            adb pull /sdcard/chart-smoke.png chart-smoke.png
            test -s chart-smoke.png
            echo 'Emulator launch smoke test passed'

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-evidence
          path: |
            chart-smoke.png
            android-emulator-logcat.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-reports
          path: android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14
