<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="color-scheme" content="dark">
<style>
html,body,#chart{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#0b0e11}
#chart{position:absolute;inset:0}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa4b2;background:#0b0e11;font:13px Arial;z-index:2}
.chart-tools{position:absolute;right:10px;top:10px;z-index:5;display:flex;gap:7px}
.chart-tool{height:34px;min-width:36px;padding:0 10px;border:1px solid #343b49;border-radius:8px;background:rgba(25,30,39,.94);color:#e6eaf0;font:600 13px Arial;box-shadow:0 2px 8px #0005}
.chart-tool:active{background:#2962ff;border-color:#2962ff}
#addAlert{font-size:19px;min-width:36px;padding:0}
</style>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script></head>
<body><div id="loading">Connecting to Binance Futures market data…</div><div id="chart"></div>
<div class="chart-tools">
<button id="resetChart" class="chart-tool" type="button" aria-label="Reset chart view">Reset</button>
<button id="addAlert" class="chart-tool" type="button" aria-label="Add price alert">+</button>
</div>
<script>
(function(){
const host=document.getElementById('chart'),loading=document.getElementById('loading');let chart=null,series=null,alertLines=[],activeSymbol='',activeInterval='',lastCount=0,forceReset=true,lastClose=0,pendingRows=null,pendingAlerts=null;
function init(){if(!window.LightweightCharts){loading.textContent='Chart library failed to load. Check internet connection.';return;}
chart=LightweightCharts.createChart(host,{width:host.clientWidth,height:host.clientHeight,layout:{background:{type:'solid',color:'#0b0e11'},textColor:'#d1d4dc'},grid:{vertLines:{color:'#1e222d'},horzLines:{color:'#1e222d'}},rightPriceScale:{borderColor:'#363c4e',autoScale:true},timeScale:{borderColor:'#363c4e',timeVisible:true,secondsVisible:false},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:true},handleScale:{axisPressedMouseMove:true,mouseWheel:true,pinch:true}});
series=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350',borderUpColor:'#26a69a',borderDownColor:'#ef5350',wickUpColor:'#26a69a',wickDownColor:'#ef5350'});
new ResizeObserver(()=>{if(chart)chart.applyOptions({width:Math.max(1,host.clientWidth),height:Math.max(1,host.clientHeight)});}).observe(host);loading.style.display='none';window.chartReady=true;if(pendingRows)window.setCandles(pendingRows);if(pendingAlerts)window.setAlerts(pendingAlerts);}
window.setCandles=function(rows,symbol){pendingRows=rows||[];if(!series)return;const clean=pendingRows.map(x=>{const rawTime=Number(x.time);return {time:Math.floor(rawTime>100000000000?rawTime/1000:rawTime),open:Number(x.open),high:Number(x.high),low:Number(x.low),close:Number(x.close)};}).filter(x=>Number.isFinite(x.time)&&x.time>0&&x.open>0&&x.high>=Math.max(x.open,x.close,x.low)&&x.low<=Math.min(x.open,x.close,x.high)).sort((a,b)=>a.time-b.time).filter((x,i,a)=>i===0||x.time!==a[i-1].time);if(!clean.length)return;lastClose=clean[clean.length-1].close;if(forceReset||lastCount===0||clean.length<lastCount){series.setData(clean);chart.timeScale().fitContent();forceReset=false;}else{series.update(clean[clean.length-1]);}if(symbol)activeSymbol=symbol;lastCount=clean.length;};
window.setSymbolInfo=function(symbol,interval){symbol=String(symbol||'');interval=String(interval||'');if(symbol!==activeSymbol||interval!==activeInterval){activeSymbol=symbol;activeInterval=interval;lastCount=0;forceReset=true;}};
window.resetChart=function(){if(!chart||!series)return;chart.timeScale().fitContent();chart.priceScale('right').applyOptions({autoScale:true});};
document.getElementById('resetChart').addEventListener('click',function(){window.resetChart();});
document.getElementById('addAlert').addEventListener('click',function(){if(lastClose>0&&window.AndroidAlert&&window.AndroidAlert.createAlertAtPrice){window.AndroidAlert.createAlertAtPrice(lastClose);}});
window.setAlerts=function(items){pendingAlerts=items||[];if(!series)return;alertLines.forEach(line=>series.removePriceLine(line));alertLines=[];(items||[]).forEach(a=>{const p=Number(a.price);if(Number.isFinite(p)&&p>0)alertLines.push(series.createPriceLine({price:p,color:'#f5a623',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'Alert'}));});};
window.addEventListener('load',init);
})();
</script></body></html>
